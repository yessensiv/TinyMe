project_id = "tinyme"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000/room", "http://127.0.0.1:3000/room?account=profile", "http://127.0.0.1:3000/room?account=recovery", "http://localhost:3000/room", "http://localhost:3000/room?account=profile", "http://localhost:3000/room?account=recovery", "http://127.0.0.1:3100/room", "http://127.0.0.1:3100/room?account=profile", "http://127.0.0.1:3100/room?account=recovery"]
jwt_expiry = 900
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
minimum_password_length = 8

[auth.email]
enable_signup = true
enable_confirmations = false
double_confirm_changes = true
secure_password_change = true
max_frequency = "1s"

[analytics]
enabled = false

[edge_runtime]
enabled = true
policy = "per_worker"

[functions.music-library]
verify_jwt = true
