name: Import MyRoom snapshot
on:
  push:
    branches: [develop]
    paths: [.github/workflows/import-myroom.yml]
permissions:
  contents: write
concurrency:
  group: import-myroom-develop
  cancel-in-progress: false
jobs:
  import:
    if: github.repository == 'yessensiv/TinyMe'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 1
      - name: Import complete immutable MyRoom tree
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 https://github.com/yessensiv/myroom.git dd02644a4ab17f5b610860c97192f86a2a799d62
          source_tree="$(git rev-parse FETCH_HEAD^{tree})"
          test "$source_tree" = "abc149cb93aae860d7b9e845883cad83d773b8d5"
          git read-tree --reset -u FETCH_HEAD
          test "$(git write-tree)" = "$source_tree"
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Import complete myroom snapshot dd02644 into develop"
          git push origin HEAD:refs/heads/develop
